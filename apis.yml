description: >-
  Erasmus University Rotterdam (EUR) is a Dutch public research university founded in 1913,
  ranked #158 in the QS World University Rankings 2025, with ROR https://ror.org/057w15z03 and
  the registrable domain eur.nl. Re-profiled on 2026-08-30 under the API Evangelist university
  pipeline, which settles WHO OPERATES a surface before crediting it to the institution. The
  June 2026 profile credited EUR with eleven API entries and ten OpenAPI contracts. Every one of
  them was api.figshare.com/v2 — one Figshare document that the same pass attributed to
  twenty-five different universities, split by tag into ten apparent surfaces titled "Figshare
  altmetric Articles API", "Figshare altmetric Authors API" and so on, and it put EUR fifth in
  the whole 248-institution university cohort. Those contracts, and the twenty Postman and
  OpenCollection files, four JSON Schemas, three JSON Structures, four payload examples, the
  JSON-LD context, the vocabulary, the OAuth scopes, the authentication summary, the
  agentic-access classification, the two Spectral rulesets and the capability map derived from
  them, have all been removed — 51 files. The attribution was wrong twice over: EUR's Figshare
  tenancy ENDED on 30 October 2025, when the EUR Data Repository moved to DataverseNL hosted by
  DANS, and datarepository.eur.nl now has no DNS record at all.


  What is left is what EUR actually operates. The genuine institution-run surface is the RePub
  OAI-PMH 2.0 endpoint at repub.eur.nl/oai — keyless, live, correctly configured with an
  OpenAIRE and an NWO set and three metadata formats, on the university library's own
  infrastructure with @ubib.eur.nl administrative contacts and no vendor CNAME in the chain.
  Beside it sits api.eur.nl, a Kong API gateway EUR runs on its own address space that answers
  401 with WWW-Authenticate: Basic realm="kong" and publishes no route, no reference and no
  contract to the public internet. EUR holds its own DataCite membership (symbol DHCM, 3,722
  DOIs minted) and publishes a live RFC 9116 security.txt. Everything else programmable is a
  tenancy that is a real institutional fact but somebody else's engineering: the EUR Research
  Repository on Elsevier Pure at pure.eur.nl, the EUR Data Repository on DataverseNL, the
  course catalogue on Caci's OSIRIS, the Canvas LMS with a live LTI 1.3 keyset, and the
  SURFconext/eduGAIN identity provider that is a Microsoft Entra tenant behind SURF's proxy.
  EUR publishes no OpenAPI of its own, no developer portal, no open data portal and no llms.txt.
