http_conditions:
- status: 404
  probed: true
  observed: >-
    GET https://repub.eur.nl/openapi.json returns 404 text/html (13,619 bytes). Paths other
    than /oai on this host fall through to the repository web application's own 404 page,
    which is HTML, not an OAI-PMH envelope.
- status: 200
  probed: true
  observed: >-
    GET https://repub.eur.nl/ returns 200 text/html — the human repository interface, not an
