standards:
- id: oai-pmh
  name: OAI-PMH 2.0 (Open Archives Initiative Protocol for Metadata Harvesting)
  conforms: true
  operator: institution
  evidence: >-
    https://repub.eur.nl/oai?verb=Identify returns 200 text/xml with a valid OAI-PMH 2.0
    envelope: repositoryName "Erasmus University OAIPMH Feed", baseURL https://repub.eur.nl/oai,
    protocolVersion 2.0, adminEmail opdecoul@ubib.eur.nl and vanhuisstede@ubib.eur.nl,
    earliestDatestamp 2023-11-24T00:00:00Z, deletedRecord transient, granularity
    YYYY-MM-DDThh:mm:ssZ. ListMetadataFormats returns three prefixes — oai_dc, mods and
    nl_didl, the last being the Dutch DIDL profile used by national aggregators. ListSets
    returns two configured sets, openaire (OpenAIRE) and nwo (NWO Funded Research), which is
    evidence of a configured repository rather than a default install. ListIdentifiers with
    metadataPrefix=oai_dc returns live headers of the form oai:repub.eur.nl:<id>, including
    status="deleted" tombstones, consistent with the declared transient deletion policy. An
    intentional badVerb request returns <error code="badVerb">Illegal verb: BadVerb</error>
    inside a 200 envelope, which is correct OAI-PMH error semantics.
  operator_evidence: >-
    repub.eur.nl is a CNAME to bib-app01.ubib.eur.nl -> 145.5.2.24. Both the alias and the
    target are inside eur.nl, on the university library's own subdomain, with no vendor host
    anywhere in the chain, and both administrative contacts are @ubib.eur.nl addresses. This
    is EUR's own repository software on EUR's own infrastructure.
  spec: https://www.openarchives.org/OAI/openarchivesprotocol.html
- id: oai-pmh
  name: OAI-PMH 2.0 with the OpenAIRE Guidelines for CRIS Managers (CERIF-XML 1.2)
  conforms: true
  operator: tenant
  evidence: >-
    https://pure.eur.nl/ws/oai?verb=Identify returns 200 application/xml: repositoryName
    "EUR Research Repository", baseURL https://pure.eur.nl/ws/oai, protocolVersion 2.0,
    earliestDatestamp 2021-06-14T10:37:49Z. The Identify description carries an OpenAIRE
    CERIF profile Service block declaring Compatibility
    OpenAIRE_Service_Compatibility#1.2, Acronym pure.eur.nl, and an explicit
    Owner/DisplayName of "Erasmus University Rotterdam" with OrgUnit acronym EUR, plus a
    rightsManifest asserting "Copyright (c) Erasmus University Rotterdam".
    ListMetadataFormats returns seven prefixes including oai_cerif_openaire; ListSets
    returns the CERIF entity sets (openaire_cris_publications, _patents, _persons,
    _orgunits, _events, _equipments, _products) alongside persons:all, publications:all,
    publications:withFiles and per-year publication sets.
  operator_evidence: >-
    pure.eur.nl is a CNAME to erasmus.elsevierpure.com -> eu.prod.elsevierpure.com ->
    eu.prod.elsevierpure.com.cdn.cloudflare.net. That is a platform CNAME, not a CDN in
    front of an EUR origin. The Identify adminEmail is purehosted@elsevier.com. The
    records, the copyright and the OpenAIRE registration are EUR's; the repository
    software, the hosting and the OAI-PMH implementation are Elsevier Pure's. The Pure web
    service itself confirms this: https://pure.eur.nl/ws/api redirects to
    /ws/api/documentation/index.html whose canonical link is
    https://api.elsevierpure.com/ws/api/documentation/index.html, and
    https://pure.eur.nl/ws/api/524/openapi.json answers 401 application/json.
  caveat: >-
    Real protocol conformance, real EUR content, vendor implementation. Credited to the
    tenancy, not to EUR's engineering.
  spec: https://openaire-guidelines-for-cris-managers.readthedocs.io/
- id: datacite
  name: DataCite DOI registration
  conforms: true
  operator: institution
  evidence: >-
    https://api.datacite.org/providers/dhcm returns 200: symbol DHCM, name and displayName
    "Erasmus University Library", memberType consortium_organization, website
    https://www.eur.nl/en/library/, rorId https://ror.org/057w15z03, created
