note: >-
  Error semantics of the one public, institution-operated API surface Erasmus University
  Rotterdam runs. The defining property, confirmed by live probe, is that protocol failures
  are returned INSIDE an HTTP 200 envelope as an <error code="..."> element — an agent or
  harvester that branches on HTTP status alone will read every failure as a success. Only
  the badVerb condition was exercised against the live host; the remaining conditions are
  the OAI-PMH 2.0 vocabulary this endpoint implements and are marked `probed: false`
  accordingly rather than being presented as observed.
transport:
  protocol_errors_use_http_status: false
  envelope: <OAI-PMH>/<error code="..."> under HTTP 200
  content_type: text/xml; charset=UTF-8
conditions:
