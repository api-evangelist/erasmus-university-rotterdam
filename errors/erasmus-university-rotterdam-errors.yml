tombstones:
  supported: true
  probed: true
  observed: >-
    ListIdentifiers with metadataPrefix=oai_dc returns <header status="deleted"> entries, e.g.
    oai:repub.eur.nl:17433 datestamp 2026-07-02T12:22:13Z. Consistent with the declared
    deletedRecord policy of "transient": deletions are reported but not guaranteed to persist,
    so a harvester cannot rely on tombstones for a complete deletion history.
