    An EUR-operated Kong API gateway. It is unambiguously live and unambiguously closed: the
    root returns 401 application/json {"message":"Unauthorized"} with
    WWW-Authenticate: Basic realm="kong", HSTS max-age 31536000, X-Frame-Options DENY,
    X-Content-Type-Options nosniff and Cache-control no-store, while /openapi.json,
    /swagger.json, /v1, /api, /health and /status all return Kong's no-route 404. Recorded
    because it is a real institution-operated API surface and its existence is a fact about
    EUR's programmable footprint — but no route, no reference, no contract and no signup are
    exposed to the public internet, and nothing about what it serves can be established from
    outside. No OpenAPI is saved for it, because none exists to save.
