  spec: https://support.datacite.org/docs/api
- id: lti
  name: LTI 1.3 / IMS Global Learning Tools Interoperability
  conforms: true
  operator: tenant
  evidence: >-
    https://canvas.eur.nl/api/lti/security/jwks returns 200 application/json with a live
    RSA JWKS (kty RSA, e AQAB, RS256 signing keys) — the LTI 1.3 platform keyset.
    https://canvas.eur.nl/.well-known/openid-configuration returns 200 declaring issuer
    https://canvas.eur.nl, authorization_endpoint /login/oauth2/auth, token_endpoint
    /login/oauth2/token, jwks_uri /login/oauth2/jwks, RS256 id-token signing and the
    authorization_code grant — the OIDC third-party-initiated login LTI 1.3 requires.
    https://canvas.eur.nl/api/v1/courses answers 401 application/json
    {"status":"unauthenticated","errors":[{"message":"user authorisation required"}]},
    confirming a live Canvas REST API behind institutional credentials.
  operator_evidence: >-
    canvas.eur.nl is a CNAME to EUR-vanity.instructure.com -> 108.139.47.x (CloudFront).
    Instructure Canvas, EUR tenancy. The courses and enrolments are EUR's; the LTI platform
    implementation is Instructure's.
  spec: https://www.imsglobal.org/spec/lti/v1p3/
- id: saml
  name: SAML 2.0 Web Browser SSO
  conforms: true
  operator: tenant
  evidence: >-
    Erasmus University Rotterdam is registered as an identity provider in the SURFconext
    federation. https://metadata.surfconext.nl/idps-metadata.xml (200, 1,032,474 bytes, 205
    entities) carries an EntityDescriptor with entityID
    https://sts.windows.net/715902d6-f63e-4b8d-929b-4bb170bad492/, an IDPSSODescriptor with
    protocolSupportEnumeration urn:oasis:names:tc:SAML:2.0:protocol, an RSA signing
    KeyDescriptor, persistent and transient NameIDFormat support, an mdui:UIInfo block with
    DisplayName "Erasmus University Rotterdam" / "Erasmus Universiteit Rotterdam" and logo
    https://static.surfconext.nl/logos/idp/eur.png, an md:Organization block with
    OrganizationURL http://www.eur.nl/, and ten shibmd:Scope declarations covering eur.nl,
    student.eur.nl, iss.nl, rsm.nl, ese.eur.nl, law.eur.nl, essb.eur.nl, eshpm.eur.nl,
    esphil.eur.nl and eshcc.eur.nl.
  operator_evidence: >-
    Marked tenant, not institution. The registration, the scopes and the organisational
    identity are EUR's, but the entityID is a Microsoft Entra ID tenant on sts.windows.net,
    and the single SingleSignOnService Location is
    https://engine.surfconext.nl/authentication/idp/single-sign-on/... — SURF's hub-and-spoke
    proxy. EUR runs neither the IdP software nor the SSO endpoint: no idp.eur.nl, sso.eur.nl
    (which resolves to the generic EUR web front end, not an IdP) or adfs.eur.nl publishes a
    SAML service. The federation membership is a genuine institutional fact; the engineering
    beneath it is Microsoft's and SURF's.
  spec: http://docs.oasis-open.org/security/saml/Post2.0/sstc-saml-tech-overview-2.0.html
