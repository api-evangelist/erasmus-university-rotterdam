  detail: >-
    Erasmus University Rotterdam publishes no API of its own — no OpenAPI, no developer portal,
    no API reference, no open data portal, no llms.txt. It operates exactly one public,
    callable, keyless API —
    the RePub OAI-PMH 2.0 harvesting endpoint — and it publishes no machine-readable contract
    for it. The OpenAPI in this repo is DERIVED by API Evangelist from live probes, not
    published by EUR. Everything else is either a vendor platform running under an eur.nl
    hostname or a gateway that exposes nothing to an unauthenticated caller. Nothing blocked
    us: sixty-plus hosts and paths were probed successfully and the thinness is the
    institution's, not a fetch failure. Verified institution-operated and live:
    https://repub.eur.nl/oai answers Identify (repositoryName "Erasmus University OAIPMH Feed",
    adminEmail opdecoul@ubib.eur.nl and vanhuisstede@ubib.eur.nl, earliestDatestamp
    2023-11-24T00:00:00Z, deletedRecord transient), ListMetadataFormats (oai_dc, mods,
    nl_didl), ListSets (openaire, nwo) and ListIdentifiers, all 200, all keyless; repub.eur.nl
    is a CNAME to bib-app01.ubib.eur.nl -> 145.5.2.24 with no vendor in the chain.
    Institution-operated but closed: https://api.eur.nl/ returns 401 with
    WWW-Authenticate: Basic realm="kong" and {"message":"Unauthorized"}, and every probed path
    returns Kong's {"message":"no Route matched with those values"} — a real EUR-run API
    gateway (api.eur.nl -> api2.eur.nl -> 145.5.1.16) whose entire route table, documentation
    and contract are private; /openapi.json, /swagger.json, /docs, /v1, /api, /health and
    /status were all probed. Institution-operated non-API surfaces: a live RFC 9116
    https://www.eur.nl/.well-known/security.txt (Contact mailto:cert@eur.nl, Expires
    2026-12-07, policy and hall-of-fame URLs, both 200) and a status page at status.eur.nl
    (200, "Status: Erasmus University Rotterdam", on Netlify, with no JSON feed —
    /api/v2/status.json and /index.json both 404). Verified live but tenant-operated:
    pure.eur.nl (CNAME erasmus.elsevierpure.com -> eu.prod.elsevierpure.com, OAI-PMH 200 with
    the OpenAIRE CERIF 1.2 profile, adminEmail purehosted@elsevier.com, /ws/api/524/openapi.json
    401), canvas.eur.nl (CNAME EUR-vanity.instructure.com, LTI 1.3 JWKS 200 and
    .well-known/openid-configuration 200, /api/v1/courses 401), eur.osiris-student.nl (Caci
    OSIRIS; the SPA shell 200s but POST /student/osiris/student/cursussen/zoeken returns a
    structured OSIRIS Link JSON error with an exchange-id, proving a live service behind it),
    and dataverse.nl/dataverse/eur (200; the dataverse.nl API is behind an Anubis
    proof-of-work bot challenge, so /api/info/version and /api/dataverses/eur return the
    challenge page rather than JSON — the host is live, we are the ones excluded). Confirmed
    dead or absent: datarepository.eur.nl returns NXDOMAIN — the Figshare-era repository
    hostname the June profile's vocabulary and rulesets still cited; no DNS for
    developer.eur.nl, developers.eur.nl, opendata.eur.nl, data.open.eur.nl, edr.eur.nl,
    dataverse.eur.nl, idp.eur.nl, adfs.eur.nl, hpc.eur.nl, mcp.eur.nl, library.eur.nl,
    primo.eur.nl, catalogue.eur.nl, vle.eur.nl or lms.eur.nl; data.eur.nl resolves but serves
    only a Taggrs server-side tracking endpoint, not open data; www.eur.nl/llms.txt,
    /.well-known/api-catalog, /.well-known/ai-plugin.json and /openapi.json all return the
    site's soft 404 ("Pagina niet gevonden", 146,268 bytes of HTML under an HTTP 404 status).
