apis:
- aid: erasmus-university-rotterdam:repub-oai
  name: RePub OAI-PMH Metadata Harvesting Interface
  x-operator: institution
  x-operator-evidence: >-
    repub.eur.nl is a CNAME to bib-app01.ubib.eur.nl -> 145.5.2.24. Both the alias and the
    target are inside eur.nl, on Erasmus University Library's own subdomain, and there is no
    vendor host anywhere in the chain. The Identify response self-reports as "Erasmus
    University OAIPMH Feed" with two administrative contacts at @ubib.eur.nl. This is EUR's own
    repository on EUR's own infrastructure — the one genuinely institution-operated, publicly
    callable API surface the university has.
  description: >-
    OAI-PMH 2.0 harvesting interface for RePub, the Erasmus University Rotterdam institutional
    publication repository. Keyless and live: Identify, ListMetadataFormats, ListSets and
    ListIdentifiers all return 200 without a credential. Three metadata formats are offered
    (oai_dc, mods and nl_didl, the Dutch DIDL profile used by national aggregators) and two
    sets are configured (openaire, nwo — NWO Funded Research), which is evidence of a
    deliberately configured repository rather than a default install. earliestDatestamp is
    2023-11-24T00:00:00Z and the deletion policy is "transient", so tombstones are reported but
    not guaranteed to persist. Protocol errors are returned inside a 200 envelope as
    <error code="..."> — a harvester that branches on HTTP status alone will read every failure
    as a success. EUR publishes no contract for this endpoint; the OpenAPI below was derived by
    API Evangelist from live probes and is marked as such.
  humanURL: https://repub.eur.nl/
