  meaning: The verb argument is missing, repeated, or not a legal OAI-PMH verb.
- code: badArgument
  http_status: 200
  probed: false
  meaning: A required argument is missing, an argument is repeated, or an argument is illegal for the verb.
- code: badResumptionToken
