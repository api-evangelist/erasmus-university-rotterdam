description: >-
  Erasmus University Rotterdam publishes no rate-limit table for any of its surfaces. Re-verified
  2026-08-30: the two open OAI-PMH endpoints (repub.eur.nl/oai, institution-operated;
  pure.eur.nl/ws/oai, an Elsevier Pure tenancy) returned no rate-limit or Retry-After header on
  any probed verb, and neither documents a harvesting quota. OAI-PMH flow control is by
  resumptionToken rather than by a limit header, so a harvester should page on the token, honour
  any Retry-After it does receive, and contact Erasmus University Library for bulk access.
  https://api.eur.nl, EUR's own Kong gateway, returns 401 before any rate-limit header is emitted,
  so nothing can be said about its limits from outside. No IIIF or library-catalogue API was
  found on any EUR host — an earlier version of this file named both and neither was verified.
notes: >-
  Confirm per-service limits with each service directly; harvest responsibly. Probed 2026-08-30 —
  no rate-limit headers observed on any open EUR surface.
sources:
- https://raw.githubusercontent.com/api-evangelist/erasmus-university-rotterdam/refs/heads/main/apis.yml
responseCodes:
  throttled: 429
limits:
- name: Default
  scope: client
  metric: requests-per-minute
  limit: see service documentation
  notes: No published global limit; large harvests may be rate-limited.
policies:
- name: Backoff Strategy
  description: Exponential backoff with jitter; honor Retry-After; harvest during off-peak hours.
